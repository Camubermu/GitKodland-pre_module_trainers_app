<!DOCTYPE html>
<html lang="es-ES">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copiar / Pegar (Mac)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

  <!-- Progreso (sin texto superior/metas) -->
  <div class="progress-wrap" aria-label="Progreso">
    <div class="progress-row">
      <div class="progress-text">
        Progreso: <b><span id="progressCount">0</span>/<span id="progressTotal">10</span></b>
        <span class="level">Nivel: <b id="levelText">1</b></span>
      </div>
      <button id="resetBtn" class="ghost" type="button">Reiniciar</button>
    </div>
    <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="main">
    <button id="startButton" class="primary">INICIAR</button>

    <!-- Estado: aquí aparecerá la instrucción CORRECTO/INCORRECTO -->
    <div id="statusLine" class="statusLine" style="display:none;">Copia y pega el texto:</div>

    <div class="game" id="gameContainer" style="display:none;">
      <div class="task">
        <div class="taskLabel">Texto para copiar:</div>
        <div id="randomText" class="randomText"></div>
      </div>

      <div id="inputField" class="inputField" contenteditable="true" aria-label="Campo para pegar"></div>

      <div class="keyboard" aria-label="Teclado">
        <div class="key" id="cmdKey">⌘ Comando</div>
        <div class="key" id="cKey">C</div>
        <div class="key" id="vKey">V</div>
      </div>
    </div>
  </div>

  <!-- MODAL DE VICTORIA -->
  <div class="modal-backdrop" id="winModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Has ganado">
      <div class="modal-header">
        <div class="modal-title">¡Ganaste! 🎉</div>
        <button class="modal-close" id="closeModal" type="button" aria-label="Cerrar">✕</button>
      </div>

      <div class="modal-body">
        <div class="win-image" id="winImage"></div>
        <p class="modal-text">¡Tu habilidad de copiar/pegar en Mac ha subido de nivel!</p>
      </div>

      <div class="modal-actions">
        <button id="restartButton" class="primary" type="button">REINICIAR</button>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
