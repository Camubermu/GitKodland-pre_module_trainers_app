<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selección de Texto</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <!-- PROGRESO -->
    <div class="progress-wrap" aria-label="Progreso">
      <div class="progress-row">
        <div class="progress-text">
          Progreso: <b><span id="progressCount">0</span>/<span id="progressTotal">10</span></b>
          <span class="level">Nivel: <b id="levelText">1</b></span>
        </div>
        <button id="resetBtn" class="ghost" type="button">Reiniciar</button>
      </div>
      <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="main">
      <button id="startButton" class="primary">INICIAR</button>

      <!-- Este elemento mostrará: instrucciones o correcto/incorrecto -->
      <div id="statusLine" class="statusLine" style="display:none;">
        Selecciona todo el texto dentro del recuadro:
      </div>

      <div class="text-frame" id="selectableTextContainer" style="display:none;">
        <div id="selectableText"></div>
      </div>
    </div>

    <!-- MODAL DE VICTORIA -->
    <div class="modal-backdrop" id="winModal" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-label="Has ganado">
        <div class="modal-header">
          <div class="modal-title">¡Has ganado! 🎉</div>
          <button class="modal-close" id="closeModal" type="button" aria-label="Cerrar">✕</button>
        </div>

        <div class="modal-body">
          <div class="win-image" id="winImage"></div>
          <p class="modal-text">
            ¡Tu habilidad de selección de texto ha mejorado!
          </p>
        </div>

        <div class="modal-actions">
          <button id="restartButton" class="primary" type="button">
            REINICIAR
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
